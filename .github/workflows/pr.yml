name: PR gates

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pr-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      # vendor/mlx-agent moves only through pin-engine.yml. The guard on main judges every pull request.
      - name: Check pins
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD" "$BRANCH"

  python-and-docs:
    needs: [pin-guard]
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.1

      - name: Run unit tests
        run: make test

      - name: Audit Python dependencies
        run: make pip-audit

      - name: Run release documentation contract tests
        run: make docs-test

  swift:
    needs: [pin-guard]
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      # Engine-backed tests run mlx-agent with the repository's .venv interpreter.
      - name: Create the engine environment
        run: python -m venv .venv

      - name: Run Swift unit tests
        run: make test-swift

  merge-engine-pin:
    needs: [python-and-docs, swift]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'bot/pin-engine-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pin bot's pull request merges itself once both gates pass.
      - name: Merge the engine pin
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for file in $(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only); do
            case "$file" in
              vendor/mlx-agent) ;;
              *) echo "::error::$file is not part of an engine pin"; exit 1 ;;
            esac
          done
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD"
