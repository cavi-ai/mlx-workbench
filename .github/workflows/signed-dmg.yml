name: Signed DMG

# Developer ID signed, notarized DMGs for the in-app updater: published
# releases get mlx-workbench-<version>.dmg; the rolling `nightly` prerelease
# gets mlx-workbench-nightly-<commit>.dmg built from main, only when started
# by hand and only when the app's sources changed since the published nightly.
# Signing uses a Developer ID certificate in a temporary keychain;
# notarization authenticates with an App Store Connect API key.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Build a nightly, release disk image, or unpublished candidate
        required: true
        default: nightly
        type: choice
        options: [nightly, release, candidate]
      candidate_commit:
        description: Full commit SHA for an unpublished candidate
        required: false
        type: string

permissions: {}

concurrency:
  group: signed-dmg-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.channel || 'nightly' }}
  cancel-in-progress: false

jobs:
  dmg:
    if: github.event_name != 'release' || github.event.release.tag_name != 'nightly'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ github.event_name == 'release' && 'release' || inputs.channel || 'nightly' }}
      DEVELOPER_TEAM: Y76GMV87GM
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the build target
        id: target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          build_channel="$CHANNEL"
          if [[ "$CHANNEL" == "candidate" ]]; then
            if ! [[ "$CANDIDATE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::An unpublished candidate requires a full commit SHA" >&2
              exit 2
            fi
            echo "ref=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            build_channel=release
          elif [[ "$CHANNEL" == "release" ]]; then
            tag="${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          fi
          echo "build_channel=$build_channel" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Skip a nightly when the app has not changed
        id: skip
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          skip=false
          if [[ "$CHANNEL" == "nightly" ]]; then
            published="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name | capture("^mlx-workbench-nightly-(?<c>[0-9a-f]+)[.]dmg$").c' 2>/dev/null || true)"
            # Docs, web UI and test-only merges do not change the app.
            if [[ -n "$published" ]] && git cat-file -e "$published^{commit}" 2>/dev/null \
              && git diff --quiet "$published" HEAD -- mlx-mac vendor/mlx-agent Makefile; then
              skip=true
              echo "::notice::App sources unchanged since nightly $published; nothing to build"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Use an existing release disk image
        id: existing
        if: env.CHANNEL == 'release'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'from mlx_workbench import __version__; print(__version__)')"
          test "$TAG" = "v$version"
          name="mlx-workbench-$version.dmg"
          digest="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$name\") | .digest // \"missing\"")"
          if [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            dmg="$RUNNER_TEMP/$name"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$dmg"
            test "$(shasum -a 256 "$dmg" | cut -d' ' -f1)" = "${digest#sha256:}"
            echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.skip.outputs.skip != 'true' && steps.existing.outputs.dmg == ''
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_P12_BASE64" || -z "$DEVELOPER_ID_P12_PASSWORD" ]]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 and DEVELOPER_ID_P12_PASSWORD must contain an encrypted Developer ID Application identity" >&2
            exit 1
          fi
          umask 077
          python3 - <<'PY'
          import base64, binascii, os
          try:
              data = base64.b64decode(os.environ["DEVELOPER_ID_P12_BASE64"], validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit("Invalid Developer ID certificate encoding")
          path = os.path.join(os.environ["RUNNER_TEMP"], "DeveloperID.p12")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "wb") as handle:
              handle.write(data)
          PY
          SIGNING_KEYCHAIN="$RUNNER_TEMP/mlx-signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperID.p12" -k "$SIGNING_KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$SIGNING_KEYCHAIN" >/dev/null
          export SIGNING_KEYCHAIN
          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          export SIGNING_IDENTITIES
          python3 - <<'PY'
          import os, re, shlex, subprocess
          team = re.escape(os.environ["DEVELOPER_TEAM"])
          pattern = rf'^\s*\d+\) [0-9A-Fa-f]{{40}} "Developer ID Application: .+ \({team}\)"$'
          if len(re.findall(pattern, os.environ["SIGNING_IDENTITIES"], re.MULTILINE)) != 1:
              raise SystemExit("Expected one valid Developer ID Application identity for the configured team")
          current = subprocess.check_output(["security", "list-keychains", "-d", "user"], text=True)
          keychains = dict.fromkeys([os.environ["SIGNING_KEYCHAIN"], *shlex.split(current)])
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *keychains], check=True)
          PY

      - name: Write the App Store Connect API key
        if: steps.skip.outputs.skip != 'true' && steps.existing.outputs.dmg == ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_KEY_P8" ]]; then
            echo "::error::Repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are required"
            exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize
        if: steps.skip.outputs.skip != 'true' && steps.existing.outputs.dmg == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_CHANNEL: ${{ steps.target.outputs.build_channel }}
        run: |
          set -euo pipefail
          make dmg DEVELOPER_TEAM="$DEVELOPER_TEAM" DMG_CHANNEL="$BUILD_CHANNEL" \
            MLX_SWIFT_DD="$RUNNER_TEMP/mlx-build" \
            ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID"

      - name: Verify the disk image
        if: steps.skip.outputs.skip != 'true'
        id: verify
        env:
          EXISTING_DMG: ${{ steps.existing.outputs.dmg }}
          BUILD_CHANNEL: ${{ steps.target.outputs.build_channel }}
        run: |
          set -euo pipefail
          dmg="${EXISTING_DMG:-$(ls .release/*.dmg)}"
          [[ "$dmg" = /* ]] || dmg="$GITHUB_WORKSPACE/$dmg"
          mount="$RUNNER_TEMP/dmg-mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          app="$mount/MLX Workbench.app"
          requirement='identifier "com.cavi.mlxworkbench" and anchor apple generic and certificate leaf[subject.OU] = "'"$DEVELOPER_TEAM"'" and notarized'
          codesign --verify --deep --strict -R "=$requirement" "$app"
          xcrun stapler validate "$app"
          test "$(plutil -extract MLXWorkbenchChannel raw "$app/Contents/Info.plist")" = "$BUILD_CHANNEL"
          test "$(plutil -extract MLXWorkbenchCommit raw "$app/Contents/Info.plist")" = "$(git rev-parse --short=12 HEAD)"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$(python3 -c 'from mlx_workbench import __version__; print(__version__)')"
          hdiutil detach "$mount"
          trap - EXIT
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Validate candidate installation and runtime sources
        if: steps.skip.outputs.skip != 'true'
        env:
          DMG: ${{ steps.verify.outputs.dmg }}
        run: |
          set -euo pipefail
          make accept-release-candidate RELEASE_DMG="$DMG" MLX_SWIFT_DD="$RUNNER_TEMP/candidate-tests"

      - name: Retain unpublished candidate
        if: env.CHANNEL == 'candidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-candidate-${{ steps.skip.outputs.commit }}
          path: |
            ${{ steps.verify.outputs.dmg }}
            .run/release-candidate/**/acceptance.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish
        if: steps.skip.outputs.skip != 'true' && steps.existing.outputs.dmg == '' && env.CHANNEL != 'candidate'
        env:
          DMG: ${{ steps.verify.outputs.dmg }}
          TAG: ${{ steps.target.outputs.tag }}
          COMMIT: ${{ steps.skip.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "release" ]]; then
            gh release upload "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY"
          else
            gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create nightly "$DMG" --prerelease --target "$(git rev-parse HEAD)" \
              --title "Nightly $COMMIT" --notes "Built from main at $COMMIT." --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove signing credentials
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/DeveloperID.p12"
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -e "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
