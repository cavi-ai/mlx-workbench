name: Signed DMG

# Developer ID signed, notarized DMGs for the in-app updater: published
# releases get mlx-workbench-<version>.dmg; the rolling `nightly` prerelease
# gets mlx-workbench-nightly-<commit>.dmg built from main, only when started
# by hand and only when the app's sources changed since the published nightly.
# Signing uses a Developer ID Application certificate imported into a
# throwaway keychain: Xcode cannot cloud-sign Developer ID when authenticated
# with an API key. Provisioning and notarization use an App Store Connect API
# key.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Build a nightly from main, or attach a DMG to the latest release
        required: true
        default: nightly
        type: choice
        options: [nightly, release]

permissions: {}

concurrency:
  group: signed-dmg-${{ github.event_name == 'release' && github.event.release.tag_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  dmg:
    if: github.event_name != 'release' || github.event.release.tag_name != 'nightly'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ github.event_name == 'release' && 'release' || inputs.channel || 'nightly' }}
      DEVELOPER_TEAM: Y76GMV87GM
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the build target
        id: target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "release" ]]; then
            tag="${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Skip a nightly when the app has not changed
        id: skip
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          skip=false
          if [[ "$CHANNEL" == "nightly" ]]; then
            published="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name | capture("^mlx-workbench-nightly-(?<c>[0-9a-f]+)[.]dmg$").c' 2>/dev/null || true)"
            # Docs, web UI and test-only merges do not change the app.
            if [[ -n "$published" ]] && git cat-file -e "$published^{commit}" 2>/dev/null \
              && git diff --quiet "$published" HEAD -- mlx-mac vendor/mlx-agent Makefile; then
              skip=true
              echo "::notice::App sources unchanged since nightly $published; nothing to build"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Write the App Store Connect API key
        if: steps.skip.outputs.skip != 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_KEY_P8" ]]; then
            echo "::error::Repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are required"
            exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Install the Developer ID certificate
        if: steps.skip.outputs.skip != 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_P12" || -z "$DEVELOPER_ID_P12_PASSWORD" ]]; then
            echo "::error::Repository secrets DEVELOPER_ID_P12 and DEVELOPER_ID_P12_PASSWORD are required"
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application: .*($DEVELOPER_TEAM)" > /dev/null

      - name: Build, sign and notarize
        if: steps.skip.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          make dmg DEVELOPER_TEAM="$DEVELOPER_TEAM" DMG_CHANNEL="$CHANNEL" \
            MLX_SWIFT_DD="$RUNNER_TEMP/mlx-build" \
            ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID"

      - name: Verify the disk image
        if: steps.skip.outputs.skip != 'true'
        id: verify
        run: |
          set -euo pipefail
          dmg="$(ls .release/*.dmg)"
          mount="$RUNNER_TEMP/dmg-mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/MLX Workbench.app"
          requirement='identifier "com.cavi.mlxworkbench" and anchor apple generic and certificate leaf[subject.OU] = "'"$DEVELOPER_TEAM"'" and notarized'
          codesign --verify --deep --strict -R "=$requirement" "$app"
          xcrun stapler validate "$app"
          test "$(plutil -extract MLXWorkbenchChannel raw "$app/Contents/Info.plist")" = "$CHANNEL"
          hdiutil detach "$mount"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.skip.outputs.skip != 'true'
        env:
          DMG: ${{ steps.verify.outputs.dmg }}
          TAG: ${{ steps.target.outputs.tag }}
          COMMIT: ${{ steps.skip.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "release" ]]; then
            gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create nightly "$DMG" --prerelease --target "$(git rev-parse HEAD)" \
              --title "Nightly $COMMIT" --notes "Built from main at $COMMIT." --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
